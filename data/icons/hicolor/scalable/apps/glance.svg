<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 60 1134 1134" width="1254" height="1254">
  <!-- Glance: calm Markdown + LaTeX reader — low-saturation eye-care palette -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75907C"/>
      <stop offset="1" stop-color="#64806C"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDD6C6"/>
      <stop offset="1" stop-color="#CFC6B2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#EDE7D9"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile (muted sage) -->
  <rect x="100" y="100" width="1054" height="1054" rx="230" ry="230" fill="url(#tile)"/>

  <!-- document page (opaque warm paper) with dog-ear cut at top-right -->
  <path d="M379 278 H757 L919 445 V910 A70 70 0 0 1 849 980 H379 A70 70 0 0 1 309 910 V348 A70 70 0 0 1 379 278 Z"
        fill="url(#paper)"/>

  <!-- dog-ear fold flap -->
  <path d="M757 278 L919 445 H757 Z" fill="url(#fold)"/>

  <!-- text lines (soft muted sage-gray) -->
  <rect x="382" y="435" width="339" height="49" rx="24.5" fill="#A3B09E"/>
  <rect x="382" y="536" width="268" height="49" rx="24.5" fill="#A3B09E"/>
  <rect x="382" y="635" width="188" height="48" rx="24" fill="#A3B09E"/>

  <!-- eye / preview mark: sharp almond (two circular arcs) -->
  <!-- paper-colored halo so tips read against the sage tile -->
  <path d="M575 796 A218 218 0 0 1 975 796 A218 218 0 0 1 575 796 Z"
        fill="#E8E2D2" stroke="#E8E2D2" stroke-width="22" stroke-linejoin="round"/>
  <path d="M575 796 A218 218 0 0 1 975 796 A218 218 0 0 1 575 796 Z"
        fill="#5C7562"/>
  <!-- opaque paper pupil -->
  <circle cx="775" cy="796" r="72" fill="#F7F3EA"/>
</svg>
