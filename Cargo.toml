[package]
name = "glance"
version = "0.1.0"
edition = "2021"
description = "A calm Markdown + LaTeX reader for GNOME"
license = "MIT"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_22"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_9", "gtk_v4_22"] }
webkit6 = { version = "0.6", features = ["v2_52"] }
sourceview5 = { version = "0.11", features = ["gtk_v4_18", "v5_18"] }
glib = "0.22"
gio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
